
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proje Web Sayfamız</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #243047;
      margin: 0;
      text-align: center;
    }
    header {
      background: #243b74;
      color: white;
      padding: 45px 20px;
    }
    main {
      max-width: 780px;
      margin: 30px auto;
      padding: 0 20px;
    }
    section {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Projemizin Adı</h1>
    <p>TED Üniversitesi - Öğrenci Projesi</p>
  </header>

  <main>
    <section>
      <h2>Proje Hakkında</h2>
      <p>Projemizin amacı ve çözmek istediği problem.</p>
    </section>

    <section>
      <h2>Projemizin Özellikleri</h2>
      <p>Geliştirdiğimiz sistemin temel özellikleri.</p>
    </section>

    <section>
      <h2>Takım Üyeleri</h2>
      <p>Takım üyelerinin isimleri.</p>
    </section>
  </main>
</body>
</html>
